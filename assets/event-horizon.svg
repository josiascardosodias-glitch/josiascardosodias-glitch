        <animate attributeName="width" begin="0.15s" dur="0.65s" fill="freeze" calcMode="discrete"
          keyTimes="0.0000;0.0526;0.1053;0.1579;0.2105;0.2632;0.3158;0.3684;0.4211;0.4737;0.5263;0.5789;0.6316;0.6842;0.7368;0.7895;0.8421;0.8947;0.9474;1.0000" values="0.0;8.9;17.9;26.8;35.8;44.7;53.7;62.6;71.6;80.5;89.5;98.4;107.4;116.3;125.3;134.2;143.2;152.1;161.1;170.0"/>
