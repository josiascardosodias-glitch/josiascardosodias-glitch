    </g>
    <g clip-path="url(#ehClipV1)">
      <text x="16" y="56" fill="#a855f7" font-family="monospace" font-size="24" font-weight="bold">159</text>
    </g>
  </g>

  <!-- Caixa 2: REPOS -->
  <g transform="translate(152, 82)">
    <rect x="0" y="0" width="114" height="74" rx="10" fill="#0e0817" stroke="#24143b" stroke-width="1.2"/>
    <g clip-path="url(#ehClipL2)">
      <text x="16" y="25" fill="#6b5b7b" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="0.8">REPOS</text>
    </g>
    <g clip-path="url(#ehClipV2)">
      <text x="16" y="56" fill="#f3e8ff" font-family="monospace" font-size="24" font-weight="bold">08</text>
    </g>
  </g>

  <!-- Caixa 3: PULL REQ -->
  <g transform="translate(596, 82)">
    <rect x="0" y="0" width="114" height="74" rx="10" fill="#0e0817" stroke="#24143b" stroke-width="1.2"/>
    <g clip-path="url(#ehClipL3)">
      <text x="16" y="25" fill="#6b5b7b" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="0.8">PULL REQ</text>
    </g>
    <g clip-path="url(#ehClipV3)">
      <text x="16" y="56" fill="#a855f7" font-family="monospace" font-size="24" font-weight="bold">02</text>
    </g>
  </g>

  <!-- Caixa 4: LAST SYNC -->
  <g transform="translate(722, 82)">
    <rect x="0" y="0" width="132" height="74" rx="10" fill="#0e0817" stroke="#24143b" stroke-width="1.2"/>
    <g clip-path="url(#ehClipL4)">
      <text x="16" y="25" fill="#6b5b7b" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="0.8">LAST SYNC</text>
    </g>
    <g clip-path="url(#ehClipV4)">
      <text x="16" y="53" fill="#f3e8ff" font-family="monospace" font-size="16" font-weight="bold">2026-11-19</text>
    </g>
  </g>
