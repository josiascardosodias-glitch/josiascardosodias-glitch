        <animate attributeName="width" begin="0.75s" dur="0.45s" fill="freeze" calcMode="discrete"
          keyTimes="0.0000;0.3333;0.6667;1.0000" values="0.0;23.3;46.7;70.0"/>
      </rect>
    </clipPath>
    <clipPath id="ehClipL2">
      <rect x="14" y="10" width="0" height="20">
