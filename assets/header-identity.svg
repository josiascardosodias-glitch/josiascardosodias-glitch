<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 212" width="880" height="212" role="img" aria-label="Josias Cardoso - IA Engineering">
  <defs>
    <!-- Fundo escuro com gradiente sutil roxo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140926" />
      <stop offset="55%" stop-color="#0a0512" />
      <stop offset="100%" stop-color="#07030d" />
    </linearGradient>

    <!-- Brilho ambiente pulsante no background atrás dos textos -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#581c87" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09040f" stop-opacity="0" />
    </radialGradient>

    <!-- Brilho pulsante em volta de JOSIAS CARDOSO -->
    <filter id="nameGlow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6.5" result="blurOuter">
        <animate attributeName="stdDeviation" values="4.5;10;4.5" dur="3.4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feFlood flood-color="#a855f7" flood-opacity="0.85" result="purpleColor">
        <animate attributeName="flood-opacity" values="0.55;0.95;0.55" dur="3.4s" repeatCount="indefinite" />
      </feFlood>
      <feComposite in="purpleColor" in2="blurOuter" operator="in" result="purpleGlow" />

      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blurInner" />
      <feFlood flood-color="#f3e8ff" flood-opacity="0.85" result="whiteColor" />
      <feComposite in="whiteColor" in2="blurInner" operator="in" result="whiteGlow" />

      <feMerge>
        <feMergeNode in="purpleGlow" />
        <feMergeNode in="whiteGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Brilho pulsante suave em volta de IA ENGINEERING -->
    <filter id="subGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="subBlur">
        <animate attributeName="stdDeviation" values="2.5;6.5;2.5" dur="3.4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feFlood flood-color="#9333ea" flood-opacity="0.75" result="subColor">
        <animate attributeName="flood-opacity" values="0.4;0.85;0.4" dur="3.4s" repeatCount="indefinite" />
      </feFlood>
      <feComposite in="subColor" in2="subBlur" operator="in" result="subPurpleGlow" />

      <feMerge>
        <feMergeNode in="subPurpleGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Máscara de entrada caractere por caractere: JOSIAS CARDOSO (0.1s -> 1.15s, congela visível) -->
    <clipPath id="nameTypeClip">
      <rect x="243.2" y="54" width="0" height="56">
        <animate attributeName="width" begin="0.1s" dur="1.05s" fill="freeze" calcMode="discrete" keyTimes="0.0000;0.0714;0.1429;0.2143;0.2857;0.3571;0.4286;0.5000;0.5714;0.6429;0.7143;0.7857;0.8571;0.9286;1.0000" values="0.0;27.4;54.8;82.2;109.6;137.0;164.4;191.8;219.2;246.6;274.0;301.4;328.8;356.2;393.6" />
      </rect>
    </clipPath>

    <!-- Máscara de entrada caractere por caractere: IA ENGINEERING (1.15s -> 2.1s, congela visível) -->
    <clipPath id="subTypeClip">
      <rect x="359.0" y="110" width="0" height="32">
        <animate attributeName="width" begin="1.15s" dur="0.95s" fill="freeze" calcMode="discrete" keyTimes="0.0000;0.0714;0.1429;0.2143;0.2857;0.3571;0.4286;0.5000;0.5714;0.6429;0.7143;0.7857;0.8571;0.9286;1.0000" values="0.0;11.0;22.0;33.0;44.0;55.0;66.0;77.0;88.0;99.0;110.0;121.0;132.0;143.0;162.0" />
      </rect>
    </clipPath>
  </defs>

  <!-- Card Principal -->
  <rect x="0.75" y="0.75" width="878.5" height="210.5" rx="14" fill="url(#bgGrad)" stroke="#26143d" stroke-width="1.5" />

  <!-- Brilho ambiente no background que permanece pulsando -->
  <ellipse cx="440" cy="104" rx="310" ry="62" fill="url(#ambientGlow)">
    <animate attributeName="rx" values="285;335;285" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite" />
  </ellipse>

  <!-- Cantoneiras Tech nos 4 cantos -->
  <path d="M 18 28 L 18 18 L 28 18" fill="none" stroke="#6b21a8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 852 18 L 862 18 L 862 28" fill="none" stroke="#6b21a8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 18 184 L 18 194 L 28 194" fill="none" stroke="#6b21a8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 852 194 L 862 194 L 862 184" fill="none" stroke="#6b21a8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Badge Superior: SYSTEM_ONLINE // V2.4 -->
  <g transform="translate(345, 22)">
    <rect x="0" y="0" width="190" height="22" rx="11" fill="#0d0618" stroke="#2c1747" stroke-width="1" />
    <circle cx="15" cy="11" r="2.6" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="102" y="14.5" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9.5" font-weight="bold" letter-spacing="1.1">SYSTEM_ONLINE // V2.4</text>
  </g>

  <!-- 1. Nome Principal: JOSIAS CARDOSO (escreve ao carregar e fica fixo com brilho) -->
  <g clip-path="url(#nameTypeClip)">
    <text x="440" y="96" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="38" font-weight="bold" letter-spacing="4.5" filter="url(#nameGlow)">JOSIAS CARDOSO</text>
  </g>
  <!-- Cursor do nome (some após terminar a digitação em 1.15s) -->
  <rect x="243.2" y="66" width="3" height="32" fill="#a855f7" opacity="0">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.99;1" begin="0.1s" dur="1.05s" fill="freeze" />
    <animate attributeName="x" begin="0.1s" dur="1.05s" fill="freeze" calcMode="discrete" keyTimes="0.0000;0.0714;0.1429;0.2143;0.2857;0.3571;0.4286;0.5000;0.5714;0.6429;0.7143;0.7857;0.8571;0.9286;1.0000" values="243.2;270.6;298.0;325.4;352.8;380.2;407.6;435.0;462.4;489.8;517.2;544.6;572.0;599.4;626.8" />
  </rect>

  <!-- Linhas laterais do subtítulo -->
  <line x1="252" y1="126" x2="322" y2="126" stroke="#2e184a" stroke-width="1.2" />
  <line x1="558" y1="126" x2="628" y2="126" stroke="#2e184a" stroke-width="1.2" />

  <!-- 2. Subtítulo: IA ENGINEERING (escreve logo após o nome e fica fixo com brilho) -->
  <g clip-path="url(#subTypeClip)">
    <text x="440" y="131" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2.5" filter="url(#subGlow)">IA ENGINEERING</text>
  </g>
  <!-- Cursor do subtítulo (aparece em 1.15s e some ao terminar em 2.1s) -->
  <rect x="359.0" y="118" width="2" height="15" fill="#a855f7" opacity="0">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.99;1" begin="1.15s" dur="0.95s" fill="freeze" />
    <animate attributeName="x" begin="1.15s" dur="0.95s" fill="freeze" calcMode="discrete" keyTimes="0.0000;0.0714;0.1429;0.2143;0.2857;0.3571;0.4286;0.5000;0.5714;0.6429;0.7143;0.7857;0.8571;0.9286;1.0000" values="359.0;370.0;381.0;392.0;403.0;414.0;425.0;436.0;447.0;458.0;469.0;480.0;491.0;502.0;513.0" />
  </rect>

  <!-- Botões Inferiores -->
  <g transform="translate(263, 156)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#7c2ae8" />
    <text x="55" y="17.5" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="bold" letter-spacing="1">PORTFOLIO ↗</text>
  </g>

  <g transform="translate(385, 156)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#0e071a" stroke="#2e184a" stroke-width="1.2" />
    <text x="55" y="17.5" text-anchor="middle" fill="#d8b4fe" font-family="monospace" font-size="10.5" font-weight="bold" letter-spacing="1">LINKEDIN ↗</text>
  </g>

  <g transform="translate(507, 156)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#0e071a" stroke="#2e184a" stroke-width="1.2" />
    <text x="55" y="17.5" text-anchor="middle" fill="#d8b4fe" font-family="monospace" font-size="10.5" font-weight="bold" letter-spacing="1">EMAIL ↗</text>
  </g>
</svg>