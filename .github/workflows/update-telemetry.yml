name: Atualizar SVGs de telemetria

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-telemetry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gera os SVGs com os números atuais
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          # Com o secret GH_PAT entram os repositórios privados; sem ele,
          # o GITHUB_TOKEN padrão só evita o limite de 60 requisições/hora.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-telemetry.mjs
      - name: Commita os SVGs se os números mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-payload.svg assets/event-horizon.svg
          git diff --cached --quiet || git commit -m "chore: atualiza SVGs de telemetria"
          git push
