name: Gerar cobrinha

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gera os SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=1E6FA8&color_dots=#ebedf0,#b3e0f5,#5bd1ff,#30a3dc,#1e6fa8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=5BD1FF&color_dots=#161b22,#0d3b5c,#1e6fa8,#30a3dc,#5bd1ff

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
