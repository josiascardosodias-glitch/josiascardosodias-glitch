name: Atualizar métricas do GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coleta as métricas
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          # Com o secret GH_PAT entram os repositórios privados; sem ele,
          # o GITHUB_TOKEN padrão só evita o limite de 60 requisições/hora.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node github-dashboard/src/index.js
      - name: Commita o README se os números mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza métricas do GitHub"
          git push
